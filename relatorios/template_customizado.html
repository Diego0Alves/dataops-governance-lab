
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Executivo - TechCommerce</title>
    <style>
        :root {
            --cor-primaria: #667eea;
            --cor-secundaria: #764ba2;
            --cor-sucesso: #27ae60;
            --cor-alerta: #f39c12;
            --cor-erro: #e74c3c;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Segoe UI, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        header {
            background: linear-gradient(135deg, var(--cor-primaria), var(--cor-secundaria));
            color: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px 10px 0 0;
        }
        .header-content {
            max-width: 600px;
            margin: 0 auto;
        }
        .logo {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .titulo {
            font-size: 2em;
            margin-bottom: 5px;
        }
        .subtitulo {
            opacity: 0.9;
            font-size: 1em;
        }
        .content {
            padding: 40px;
        }
        footer {
            background: #f5f7fa;
            padding: 20px;
            text-align: center;
            color: #666;
            border-top: 1px solid #e1e4e8;
            margin-top: 40px;
            border-radius: 0 0 10px 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="logo">🛒</div>
                <div class="titulo">Dashboard Executivo - TechCommerce</div>
                <div class="subtitulo">Análise de Qualidade de Dados 2025</div>
            </div>
        </header>
        
        <div class="content">
            <h2>Customizado para TechCommerce</h2>
            <p style="margin-top: 10px; color: #666;">
                Template gerado em 17/11/2025 às 19:13:44
            </p>
        </div>
        
        <footer>
            <p>TechCommerce | 1.0</p>
        </footer>
    </div>
</body>
</html>
